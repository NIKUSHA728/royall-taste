<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROYAL TASTE</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;color:#222;background:#fff}
header{background:#b51226;color:white;padding:20px 6%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
.logo{font-size:27px;font-weight:bold}
nav a{color:white;text-decoration:none;margin:8px;font-weight:bold}
.hero{background:linear-gradient(120deg,#4c0010,#c5122b);color:white;text-align:center;padding:75px 15px}
.hero h1{font-size:42px;margin:0 0 15px}
.hero p{font-size:18px}
button{background:#bd1429;color:white;border:0;border-radius:7px;padding:12px 17px;font-weight:bold;cursor:pointer}
button:hover{background:#880d1d}
section{padding:35px 6%}
h2{text-align:center;color:#b51226}
.filters{text-align:center;margin:22px}
.filters button{margin:5px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.card{background:white;border:1px solid #eee;border-radius:12px;overflow:hidden;text-align:center;padding-bottom:18px;box-shadow:0 3px 12px #0001}
.card img{width:100%;height:185px;object-fit:cover;background:#eee}
.card h3{margin:13px 5px}
.price{color:#b51226;font-size:18px;font-weight:bold}
.cart{background:#fff0f0;border-radius:12px;padding:20px;margin-top:30px}
.cartline{display:flex;justify-content:space-between;align-items:center;margin:12px 0;gap:10px}
.cartline button{padding:7px 12px}
input,textarea{width:100%;padding:13px;margin:8px 0;border:1px solid #ccc;border-radius:7px;font-size:15px}
footer{background:#222;color:white;text-align:center;padding:28px}
footer h2{color:white}
</style>
</head>
<body>

<header>
<div class="logo">ROYAL TASTE 👑</div>
<nav>
<a href="#home">მთავარი</a>
<a href="#menu">მენიუ</a>
<a href="#order">შეკვეთა</a>
<a href="#contact">კონტაქტი</a>
</nav>
</header>

<div class="hero" id="home">
<h1>ROYAL TASTE</h1>
<p>შენი საყვარელი ფასტფუდი ერთ სივრცეში!</p>
<a href="#menu"><button>მენიუს ნახვა</button></a>
</div>

<section id="menu">
<h2>ჩვენი მენიუ 🍔</h2>
<div class="filters">
<button onclick="filterMenu('all')">ყველა</button>
<button onclick="filterMenu('burger')">ბურგერები</button>
<button onclick="filterMenu('pizza')">პიცა</button>
<button onclick="filterMenu('fries')">ფრი</button>
<button onclick="filterMenu('hotdog')">ჰოთ-დოგი</button>
</div>
<div class="products" id="products"></div>
<div class="cart">
<h2>🛒 კალათა</h2>
<div id="cartItems">კალათა ცარიელია</div>
<h3>ჯამი: <span id="total">0</span> ₾</h3>
</div>
</section>

<section id="order">
<h2>შეკვეთის ფორმა</h2>
<form onsubmit="placeOrder(event)">
<input id="customer" placeholder="სახელი და გვარი" required>
<input id="phone" type="tel" placeholder="ტელეფონის ნომერი" required>
<textarea id="address" placeholder="მისამართი" required></textarea>
<button type="submit">შეკვეთის გაფორმება</button>
</form>
<p id="message"></p>
</section>

<footer id="contact">
<h2>ROYAL TASTE</h2>
<p>📍 თბილისი, საბურთალო, პეკინის 17</p>
<p>📞 574 15 18 50</p>
<p>✉ royaltaste@gmail.com</p>
<p>© 2026 ROYAL TASTE</p>
</footer>

<script>
const products=[
{id:1,name:"Classic Burger",cat:"burger",price:12,img:"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=700"},
{id:2,name:"Double Cheeseburger",cat:"burger",price:18,img:"https://images.unsplash.com/photo-1553979459-d2229ba7433a?w=700"},
{id:3,name:"Chicken Burger",cat:"burger",price:14,img:"https://images.unsplash.com/photo-1606755962773-d324e0a13086?w=700"},
{id:4,name:"Pepperoni Pizza",cat:"pizza",price:22,img:"https://images.unsplash.com/photo-1628840042765-356cda07504e?w=700"},
{id:5,name:"Four Cheese Pizza",cat:"pizza",price:24,img:"https://images.unsplash.com/photo-1571407970349-bc81e7e96d47?w=700"},
{id:6,name:"Margherita Pizza",cat:"pizza",price:20,img:"https://images.unsplash.com/photo-1579751626657-72bc17010498?w=700"},
{id:7,name:"Classic French Fries",cat:"fries",price:7,img:"https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=700"},
{id:8,name:"Cheese Fries",cat:"fries",price:10,img:"https://images.unsplash.com/photo-1630384060421-cb20d0e0649d?w=700"},
{id:9,name:"Classic Hot Dog",cat:"hotdog",price:9,img:"https://images.unsplash.com/photo-1612392062798-2dbaa2b0b9f8?w=700"},
{id:10,name:"Cheese Hot Dog",cat:"hotdog",price:12,img:"https://images.unsplash.com/photo-1619740455993-9d701c3c7e6b?w=700"}
];

let cart={};

function showProducts(items=products){
const area=document.getElementById("products");
area.innerHTML="";
items.forEach(p=>{
const card=document.createElement("article");
card.className="card";
const img=document.createElement("img");
img.src=p.img;
img.alt=p.name;
img.onerror=()=>{img.alt="ფოტო ვერ ჩაიტვირთა";img.style.display="none"};
card.appendChild(img);
const title=document.createElement("h3");
title.textContent=p.name;
card.appendChild(title);
const price=document.createElement("p");
price.className="price";
price.textContent=p.price+" ₾";
card.appendChild(price);
const btn=document.createElement("button");
btn.textContent="კალათაში დამატება";
btn.onclick=()=>addToCart(p.id);
card.appendChild(btn);
area.appendChild(card);
});
}

function filterMenu(cat){
showProducts(cat==="all"?products:products.filter(p=>p.cat===cat));
}

function addToCart(id){
cart[id]=(cart[id]||0)+1;
updateCart();
}

function changeQty(id,amount){
cart[id]+=amount;
if(cart[id]<=0)delete cart[id];
updateCart();
}

function updateCart(){
const area=document.getElementById("cartItems");
area.innerHTML="";
let total=0;
Object.keys(cart).forEach(id=>{
const p=products.find(x=>x.id===Number(id));
total+=p.price*cart[id];
const line=document.createElement("div");
line.className="cartline";
const name=document.createElement("span");
name.textContent=p.name+" × "+cart[id];
const controls=document.createElement("span");
const minus=document.createElement("button");
minus.textContent="−";
minus.onclick=()=>changeQty(p.id,-1);
const plus=document.createElement("button");
plus.textContent="+";
plus.onclick=()=>changeQty(p.id,1);
controls.append(minus,plus);
line.append(name,controls);
area.appendChild(line);
});
if(total===0)area.textContent="კალათა ცარიელია";
document.getElementById("total").textContent=total;
}

function placeOrder(event){
event.preventDefault();
if(Object.keys(cart).length===0){
document.getElementById("message").textContent="ჯერ დაამატე პროდუქტი კალათაში!";
return;
}
document.getElementById("message").textContent=
"შეკვეთა დემო რეჟიმში შეიქმნა. რეალურად არ იგზავნება.";
}

showProducts();
</script>
</body>
</html>
